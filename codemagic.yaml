workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Add ios platform and sync
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Install pods dynamically
        script: |
          PODFILE_DIR=$(dirname $(find ios -name "Podfile" | head -n 1))
          if [ -d "$PODFILE_DIR" ]; then
            cd "$PODFILE_DIR" && pod install
          else
            echo "Podfile not found"
            exit 1
          fi
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          echo "Building workspace: $WORKSPACE"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
