workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Setup Capacitor iOS and Install Pods
        script: |
          rm -rf ios
          npm install @capacitor/ios --save || true
          npx cap add ios
          npx cap sync ios
          
          # Localizar o Podfile dinamicamente
          PODFILE_PATH=$(find . -name "Podfile" | head -n 1)
          if [ -z "$PODFILE_PATH" ]; then
            echo "=== DEBUG: Podfile não encontrado. Listando estrutura da pasta ios ==="
            find ios -maxdepth 3 || true
            exit 1
          fi
          
          POD_DIR=$(dirname "$PODFILE_PATH")
          echo "Podfile encontrado em: $POD_DIR"
          cd "$POD_DIR" && pod install
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          echo "Building workspace: $WORKSPACE"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
