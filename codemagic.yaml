workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "app.lovable.oxyvra"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Setup Capacitor iOS
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Force Bundle ID in Xcode project
        script: |
          node -e '
            const fs = require("fs");
            const pbxprojPath = "ios/App/App.xcodeproj/project.pbxproj";
            let content = fs.readFileSync(pbxprojPath, "utf8");
            content = content.replace(/PRODUCT_BUNDLE_IDENTIFIER = [^;]+/g, "PRODUCT_BUNDLE_IDENTIFIER = app.lovable.oxyvra");
            fs.writeFileSync(pbxprojPath, content, "utf8");
            console.log("Bundle ID forced to app.lovable.oxyvra in pbxproj");
          '
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme App
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
