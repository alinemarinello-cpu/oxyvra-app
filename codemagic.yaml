workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      # Certifique-se de configurar suas credenciais de assinatura (App Store Connect API ou Certificados) nas variáveis de ambiente do Codemagic
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Setup Capacitor iOS
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme App --disable-xcclean || {
            echo "=== EXIBINDO ÚLTIMAS 200 LINHAS DO LOG DO XCODE ==="
            tail -n 200 /tmp/xcodebuild_logs/*.log || true
            exit 1
          }
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
