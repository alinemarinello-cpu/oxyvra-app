workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Setup Capacitor iOS
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          echo "Building workspace: $WORKSPACE"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
