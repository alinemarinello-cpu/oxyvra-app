workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Add ios platform
        script: npx cap add ios || true
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.oxyvra.app --type IOS_APP_STORE --create
      - name: Build iOS Binary
        script: |
          xcode-project build-ipa --project ios/App/App.xcworkspace --scheme App
    artifacts:
      - ios/App/build/derivedData/Build/Products/Release-iphoneos/*.ipa
