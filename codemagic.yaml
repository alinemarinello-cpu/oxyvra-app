workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install Pods safely
        script: |
          POD_DIR=$(find ios -name "Podfile" -exec dirname {} \; | head -n 1)
          if [ -n "$POD_DIR" ]; then
            echo "Found Podfile in $POD_DIR"
            cd "$POD_DIR" && pod install
          else
            echo "Podfile not found, forcing cap add ios"
            npx cap add ios
            npx cap sync ios
            cd ios/App && pod install
          fi
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          echo "Building workspace: $WORKSPACE"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
