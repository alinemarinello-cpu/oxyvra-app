workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Setup Capacitor iOS and Install Pods
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          PODFILE_PATH=$(find . -name "Podfile" | head -n 1)
          if [ -n "$PODFILE_PATH" ]; then
            POD_DIR=$(dirname "$PODFILE_PATH")
            echo "Found Podfile in $POD_DIR"
            cd "$POD_DIR" && pod install
          else
            echo "Error: Podfile not found!"
            exit 1
          fi
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          echo "Building workspace: $WORKSPACE"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
