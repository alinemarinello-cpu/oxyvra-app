workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Add ios platform
        script: npx cap add ios || true
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS Binary
        script: |
          xcode-project build-ipa --scheme App
    artifacts:
      - ios/App/build/derivedData/Build/Products/Release-iphoneos/*.ipa
