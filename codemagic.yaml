workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    environment:
      node: latest
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Setup Capacitor iOS
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Set up automatic code signing
        script: |
          xcode-project use-automatic-signing
      - name: Build iOS Binary
        script: |
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme App
    artifacts:
      - ios/**/build/ios/ipa/*.ipa
      - ios/**/*.ipa
